name: Deploy web app (app.htnq.org)

# Builds the browser version and publishes it to GitHub Pages under the custom
# domain app.htnq.org. One-time owner setup is in docs/web-hosting.md
# (Pages source = GitHub Actions, custom domain, DNS CNAME, repository variables).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The web build needs no native modules or the Electron binary.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Public, browser-safe values only (Supabase URL + anon key). Never put
      # private credentials in VITE_ variables: they are bundled into the page.
      - name: Check build configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Set the VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY repository variables (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          if ! echo "$VITE_SUPABASE_URL" | grep -Eq '^https://[a-z0-9]+\.supabase\.co$'; then
            echo "::error::VITE_SUPABASE_URL must be just the project URL, like https://<project-ref>.supabase.co (no /rest/v1/ or trailing slash)."
            exit 1
          fi

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build:web

      - name: Add custom domain
        run: |
          echo "app.htnq.org" > dist-web/CNAME
          touch dist-web/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
